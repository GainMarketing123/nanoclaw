[Service]
# Subscription cutover (2026-07-11) — shared-identity OAuth credential
# (CEO decision, Option A: one Max-subscription OAuth credential shared
# across the VPS inference surfaces, group-readable by atlas-svc).
#
# The credential proxy (src/credential-proxy.ts) runs inside this unit as
# nanoclaw-svc with Group=atlas-svc. In OAuth mode (no ANTHROPIC_API_KEY
# anywhere) it reads claudeAiOauth.accessToken from
# $CLAUDE_CONFIG_DIR/.credentials.json. Without this override it would
# resolve $HOME/.claude (the shared EnvironmentFile sets HOME=/home/atlas,
# whose credential is 0600 atlas:atlas — unreadable here) and fall back to
# a no-refresh env token.
#
# /home/nanoclaw-he/.claude/.credentials.json is the canonical shared
# credential: owned nanoclaw-he, group atlas-svc, mode 0640 (group-READ
# only — this unit never owns writes to it). Refresh ownership stays with
# the nanoclaw-he :15/:45 auto-refresh cron; the proxy's own
# saveCredentials() persistence path preserves the file's existing mode
# and is expected to fail closed (EACCES) on this deployment — handled
# by its callers.
#
# Live path: /etc/systemd/system/nanoclaw.service.d/oauth-shared-identity.conf
# (see infra/INSTALL.md). Requires daemon-reload + nanoclaw restart.
Environment=CLAUDE_CONFIG_DIR=/home/nanoclaw-he/.claude

# Self-contained group grant (codex review on the cutover branch flagged the
# gap as BLOCKING): reading the 0640 nanoclaw-he:atlas-svc credential requires
# the service to hold the atlas-svc group. The live VPS base unit already sets
# Group=atlas-svc, but this drop-in must not silently depend on that —
# a deployment whose base unit uses a different primary group would get
# EACCES on every credential read and start OAuth mode tokenless.
# SupplementaryGroups= is additive (merges with base-unit groups), so this is
# a no-op where Group=atlas-svc is already primary and a fix everywhere else.
SupplementaryGroups=atlas-svc
