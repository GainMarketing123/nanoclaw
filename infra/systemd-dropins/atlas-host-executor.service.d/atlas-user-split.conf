[Service]
# Phase 3.2 cutover (1.A.6) — switch host-executor identity from gateway
# to dedicated nanoclaw-he user. Mirrors Phase 2 nanoclaw-mc pattern.
#
# User= and Group= override the main unit values. HOME= override targets
# the new user home (where .ssh/.claude/.gitconfig now live). The main
# unit Environment=HOME=/home/atlas is replaced.
#
# BindPaths is additive across drop-ins. /home/nanoclaw-he must be
# visible past the ProtectHome=tmpfs in hardening.conf — without this,
# the service sees an empty tmpfs at HOME and cannot read its own
# SSH/OAuth credentials.
#
# Tracked in-repo 2026-07-11 (subscription cutover; codex review on the
# cutover branch flagged the gap as BLOCKING): the 2026-07-11 OAuth
# quality-check gate (host/host-executor.py:_load_oauth_token) resolves
# the credential from the RUNNING user's $HOME/.claude, and the tracked
# refresh paths (host/refresh-claude-auth.sh; the :15/:45 nanoclaw-he
# auto-refresh cron) maintain /home/nanoclaw-he/.claude/.credentials.json.
# Without this drop-in a repo-based deploy would run the service as the
# base unit's user and read a credential no tracked refresher maintains.
# This file is byte-aligned with the live VPS drop-in at
# /etc/systemd/system/atlas-host-executor.service.d/atlas-user-split.conf
# (live since Phase 3.2; see infra/INSTALL.md for the install command).

User=nanoclaw-he
Group=atlas-svc

Environment=HOME=/home/nanoclaw-he

# READ-ONLY HOME — DELIBERATE (do not add /home/nanoclaw-he to
# ReadWritePaths). Under hardening.conf's ProtectSystem=strict, BindPaths
# makes this home VISIBLE in the service's mount namespace but not writable
# (writes are allowed only for ReadWritePaths entries, which mirror the
# host-task policy's allowed_project_dirs union). That asymmetry is
# load-bearing for the shared-identity credential design (2026-07-11
# cutover): the service's `claude -p` can READ the fresh OAuth credential
# every launch but can never write-back/clobber
# /home/nanoclaw-he/.claude/.credentials.json (which would race the
# credential's real writers and could strip the shared 0640 group-read
# posture). The ONLY credential writers run OUTSIDE this sandbox: the
# :15/:45 nanoclaw-he auto-refresh cron and the root transplant script
# host/refresh-claude-auth.sh. The CLI tolerates EROFS on its per-user
# state writes (proven live since the Phase 3.2 cutover: host tasks and
# quality checks succeed under exactly this posture). If a future change
# genuinely needs a writable per-user path, grant the NARROWEST subpath —
# never the whole home, and never the .claude credential file.
BindPaths=/home/nanoclaw-he
