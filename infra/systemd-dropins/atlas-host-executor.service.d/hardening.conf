[Service]
# In-tree mirror of the live VPS drop-in
# /etc/systemd/system/atlas-host-executor.service.d/hardening.conf, brought
# under git control 2026-06-11 (night-2026-06-11 N1) so the executor's mount
# sandbox is a reviewable, deployable artifact rather than VPS-only state.
#
# SEC-1 round-trip fix (2026-06-11): the ProtectHome=tmpfs sandbox replaces
# /home with an empty tmpfs in the executor's mount namespace, and BindPaths
# selectively re-mounts only the listed host paths back in. The original list
# bound /home/atlas/nanoclaw + /home/atlas/.atlas but NOT the project roots,
# so a host-task targeting /home/atlas/projects/gpg (a real, host-present
# directory that the issuer policy allows) read back as absent inside the
# executor and failed with "Project directory not found" — even though the dir
# exists on the host (drwxrwxr-x atlas:atlas). The fix binds the policy-allowed
# project roots so they are visible to the executor.
#
# BindPaths is the EXACT set of host paths any host-task policy entry can name
# as a project_dir, and nothing more — derive it from
# infra/host-task-policy.json `allowed_project_dirs` (the UNION across all
# groups), so the executor can see every allowed target and no unallowed
# sibling. Today that union is: /home/atlas/.atlas, /home/atlas/.atlas-operations,
# /home/atlas/nanoclaw, and the three project roots /home/atlas/projects/{gpg,
# crownscape,wisestream}. We bind the SPECIFIC project roots, NOT the parent
# /home/atlas/projects (binding the parent would make every group's siblings
# visible — e.g. an atlas_gpg task, allowed only .../gpg, would still SEE
# crownscape + wisestream; defense-in-depth = mount only what a policy needs).
# KEEP THIS LIST == the policy's allowed_project_dirs union: add a path here
# whenever a new allowed_project_dir is added, or host-tasks targeting it hit
# "Project directory not found or not visible" (the exact bug this fixes).
#
# ReadWritePaths MUST mirror the same allowed_project_dirs union as BindPaths
# (cross-review FAIL_BLOCKING 2026-06-11): under ProtectSystem=strict every path
# is read-only unless allow-listed in ReadWritePaths, and BindPaths only makes a
# path VISIBLE, not writable. A host task runs `claude -p` plus git
# commit/merge/push with cwd=project_dir (host-executor.py:1118-1233), so a
# project root that is bound-but-read-only passes the os.path.isdir() visibility
# check and then fails at runtime with EROFS on the first write. So every
# writable project root in BindPaths is also listed here. (nanoclaw keeps its
# /logs subpath too — harmless, it is covered by the parent entry now.)
#
# DEPLOY (morning): copy this file to
# /etc/systemd/system/atlas-host-executor.service.d/hardening.conf on the VPS
# (root-owned), then `systemctl daemon-reload` + restart the unit via the
# restart-queue or docker-root nsenter (atlas has no systemctl restart grant).
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_DAC_READ_SEARCH
NoNewPrivileges=true
ProtectSystem=strict
ReadWritePaths=/home/atlas/nanoclaw /home/atlas/.atlas /home/atlas/.atlas-operations /home/atlas/projects/gpg /home/atlas/projects/crownscape /home/atlas/projects/wisestream
ProtectHome=tmpfs
BindPaths=/home/atlas/nanoclaw /home/atlas/.atlas /home/atlas/.atlas-operations /home/atlas/projects/gpg /home/atlas/projects/crownscape /home/atlas/projects/wisestream
PrivateDevices=true
ProtectKernelModules=true
ProtectKernelLogs=true
RestrictRealtime=true
RestrictSUIDSGID=true
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
